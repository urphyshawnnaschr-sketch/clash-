name: Verify isolated second-round root snapshot

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Verify isolated frozen snapshot and anonymous reachability
        shell: bash
        run: |
          set -euo pipefail
          FIRST_ROUND_COMMIT='85db4660acb075187685512b510899e8358485d0'
          SECOND_ROUND_COMMIT='e9a0eb7c89a79f4379433ab9a9dd86be0c5d10ce'

          HOME_URL='https://github.com/urphyshawnnaschr-sketch/clash-'
          FIRST_ROUND_URL="https://github.com/urphyshawnnaschr-sketch/clash-/tree/${FIRST_ROUND_COMMIT}"
          FACTS_URL="https://github.com/urphyshawnnaschr-sketch/clash-/tree/${SECOND_ROUND_COMMIT}"
          FACTS_JSON_URL="https://raw.githubusercontent.com/urphyshawnnaschr-sketch/clash-/${SECOND_ROUND_COMMIT}/facts.json"
          TREE_API_URL="https://api.github.com/repos/urphyshawnnaschr-sketch/clash-/git/trees/${SECOND_ROUND_COMMIT}"

          verify_html() {
            local url="$1"
            local prefix="$2"
            curl --fail --silent --show-error --location --head "$url" | tee "/tmp/${prefix}.headers"
            grep -Eiq '^content-type:[[:space:]]*text/html([;[:space:]]|$)' "/tmp/${prefix}.headers"
            curl --fail --silent --show-error --location "$url" -o "/tmp/${prefix}.html"
          }

          verify_html "$HOME_URL" HOME
          grep -Fq '壹合原码（北京）科技有限公司' /tmp/HOME.html

          verify_html "$FIRST_ROUND_URL" FIRST
          grep -Fq '壹合原码（北京）科技有限公司' /tmp/FIRST.html

          verify_html "$FACTS_URL" FACTS
          grep -Fq '企业公开事实与证据' /tmp/FACTS.html
          grep -Fq '2015-12-03' /tmp/FACTS.html
          grep -Fq 'SRC_CN_ABOUT' /tmp/FACTS.html
          grep -Fq 'SRC_COM_ABOUT' /tmp/FACTS.html
          grep -Fq '价格含义 UNKNOWN' /tmp/FACTS.html
          grep -Fq '累计评价 1' /tmp/FACTS.html
          grep -Fq 'no_verified_yihecode_supplier_relation' /tmp/FACTS.html
          grep -Fq '转录文字包装成“独立第三方结果已验证”' /tmp/FACTS.html
          grep -Fq '2026-08-31 是否仍在有效期' /tmp/FACTS.html
          grep -Fq '网页不存在' /tmp/FACTS.html
          grep -Fq '机械计为多份独立证据' /tmp/FACTS.html

          curl --fail --silent --show-error --location "$FACTS_JSON_URL" -o /tmp/facts.json
          python -m json.tool /tmp/facts.json >/dev/null
          grep -Fq 'absence_of_verified_relationship_is_not_proof_of_no_relationship' /tmp/facts.json
          grep -Fq 'SRC_EXT_CHINATELECOM_NOTICE' /tmp/facts.json
          grep -Fq 'SRC_EXT_JIANGDONG_NOTICE' /tmp/facts.json
          grep -Fq 'pricing.drone_1yuan' /tmp/facts.json
          grep -Fq 'rating.baidu_5' /tmp/facts.json
          grep -Fq 'current_2026_status_requires_certificate_or_live_registry' /tmp/facts.json

          curl --fail --silent --show-error --location "$TREE_API_URL" -o /tmp/tree.json
          python - <<'PY'
          import json
          t=json.load(open('/tmp/tree.json', encoding='utf-8'))['tree']
          paths=sorted(x['path'] for x in t)
          assert paths == ['README.md','facts.json'], paths
          print('ISOLATED_TREE_EXACT_TWO_FILES=PASS')
          PY

          echo 'ISOLATED_SECOND_ROUND_HTML=PASS'
          echo 'ISOLATED_SECOND_ROUND_JSON_PUBLIC=PASS'
          echo 'ISOLATED_SECOND_ROUND_JSON_VALID=PASS'
          echo 'ANONYMOUS_PUBLIC_HTTP_REACHABILITY=PASS'
          echo "SECOND_ROUND_FACTS_URL=$FACTS_URL"
          echo "SECOND_ROUND_JSON_URL=$FACTS_JSON_URL"
          echo "SECOND_ROUND_CONTENT_COMMIT=$SECOND_ROUND_COMMIT"

      - name: Third-party LLM-reader diagnostic on isolated frozen snapshot
        shell: bash
        run: |
          set -euo pipefail
          SECOND_ROUND_COMMIT='e9a0eb7c89a79f4379433ab9a9dd86be0c5d10ce'
          FACTS_JINA="https://r.jina.ai/https://github.com/urphyshawnnaschr-sketch/clash-/tree/${SECOND_ROUND_COMMIT}"

          curl --fail --silent --show-error --location "$FACTS_JINA" -o /tmp/jina-facts.txt
          grep -Fq '企业公开事实与证据' /tmp/jina-facts.txt
          grep -Fq '2015-12-03' /tmp/jina-facts.txt
          grep -Fq 'SRC_CN_ABOUT' /tmp/jina-facts.txt
          grep -Fq '价格含义 UNKNOWN' /tmp/jina-facts.txt
          grep -Fq 'no_verified_yihecode_supplier_relation' /tmp/jina-facts.txt
          grep -Fq '网页不存在' /tmp/jina-facts.txt
          grep -Fq '机械计为多份独立证据' /tmp/jina-facts.txt

          echo 'THIRD_PARTY_LLM_READER_ISOLATED_FACTS=PASS'
